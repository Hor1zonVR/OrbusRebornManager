name: One-time RebornManager v0.5.0 publish request

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v050-once.yml

permissions:
  contents: read
  actions: write

jobs:
  start-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Verify current main passed its Windows build
        shell: bash
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          set -euo pipefail
          status="missing"
          for attempt in $(seq 1 40); do
            status="$(gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow build-windows.yml --branch main --limit 25 \
              --json headSha,conclusion,event \
              | jq -r --arg sha "$GITHUB_SHA" \
                '[.[] | select(.headSha == $sha and .event == "push")][0].conclusion // "pending"')"
            if [ "$status" = "success" ]; then break; fi
            if [ "$status" = "failure" ] || [ "$status" = "cancelled" ]; then
              echo "::error::The Windows build failed; will not publish."
              exit 1
            fi
            sleep 15
          done
          if [ "$status" != "success" ]; then
            echo "::error::Windows build not successful: $status"
            exit 1
          fi
      - name: Request minor-version public release
        shell: bash
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run publish-update.yml \
            --repo "$GITHUB_REPOSITORY" --ref main --field bump=minor
          echo "## Requested next public minor release" >> "$GITHUB_STEP_SUMMARY"
          echo "The normal publish workflow will tag and release the build after its checks." >> "$GITHUB_STEP_SUMMARY"
