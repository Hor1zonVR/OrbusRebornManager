name: Publish RebornManager v0.7.1 mod-label hotfix once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v071-once.yml

permissions:
  contents: read
  actions: write

jobs:
  request-public-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Verify matching main Windows build
        shell: bash
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          set -euo pipefail
          status="pending"
          for attempt in $(seq 1 60); do
            status="$(gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow build-windows.yml --branch main --limit 35 \
              --json headSha,conclusion,event \
              | jq -r --arg sha "$GITHUB_SHA" \
                '[.[] | select(.headSha == $sha and .event == "push")][0].conclusion // "pending"')"
            if [ "$status" = "success" ]; then break; fi
            if [ "$status" = "failure" ] || [ "$status" = "cancelled" ]; then
              echo "::error::Windows build failed; no public patch."
              exit 1
            fi
            sleep 15
          done
          test "$status" = "success" || { echo "::error::Missing successful main build"; exit 1; }
      - name: Publish patch update
        shell: bash
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run publish-update.yml --repo "$GITHUB_REPOSITORY" \
            --ref main --field bump=patch
          echo "Public patch release requested for readable mod names." >> "$GITHUB_STEP_SUMMARY"
