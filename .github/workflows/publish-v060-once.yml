name: Publish RebornManager v0.6.0 once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v060-once.yml

permissions:
  contents: read
  actions: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for successful main Windows build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status="pending"
          for attempt in $(seq 1 60); do
            status="$(gh run list --repo "$GITHUB_REPOSITORY"               --workflow build-windows.yml --branch main --limit 35               --json headSha,conclusion,event               | jq -r --arg sha "$GITHUB_SHA"                 '[.[] | select(.headSha == $sha and .event == "push")][0].conclusion // "pending"')"
            if [ "$status" = "success" ]; then break; fi
            if [ "$status" = "failure" ] || [ "$status" = "cancelled" ]; then
              echo "::error::Windows build failed. Public release was not started."
              exit 1
            fi
            sleep 15
          done
          if [ "$status" != "success" ]; then
            echo "::error::Windows build not successful: $status"
            exit 1
          fi
      - name: Request next public minor version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run publish-update.yml             --repo "$GITHUB_REPOSITORY" --ref main --field bump=minor
          echo "Release workflow requested for v0.6.0 after Windows build passed." >> "$GITHUB_STEP_SUMMARY"
