name: Publish RebornManager v0.7.0 once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v070-once.yml

permissions:
  contents: read
  actions: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - name: Require successful Windows build with update smoke tests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status="pending"
          for attempt in $(seq 1 60); do
            status="$(gh run list --repo "$GITHUB_REPOSITORY"               --workflow build-windows.yml --branch main --limit 35               --json headSha,conclusion,event               | jq -r --arg sha "$GITHUB_SHA"                 '[.[] | select(.headSha == $sha and .event == "push")][0].conclusion // "pending"')"
            if [ "$status" = "success" ]; then break; fi
            if [ "$status" = "failure" ] || [ "$status" = "cancelled" ]; then
              echo "::error::Windows game-update tests failed. Public release aborted."
              exit 1
            fi
            sleep 15
          done
          if [ "$status" != "success" ]; then
            echo "::error::Windows build did not complete successfully: $status"
            exit 1
          fi
      - name: Start official minor-version release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run publish-update.yml --repo "$GITHUB_REPOSITORY"             --ref main --field bump=minor
          echo "Started public v0.7.0 release after Windows game-update safety tests." >> "$GITHUB_STEP_SUMMARY"
